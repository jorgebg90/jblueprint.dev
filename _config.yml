# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your site. Values are accessible in templates
# via site.* variables.

title: jblueprint.dev
name: "Jorge Bluebird"
email: ""
description: >-
  A bilingual Jekyll blog about software engineering, tools, and ideas.
  Written in English and Spanish.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://jblueprint.dev" # the base hostname & protocol for your site

# Minimal Mistakes theme settings
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: default

# Enable built-in Lunr search — renders the magnifying glass toggle in the masthead.
search: true
search_provider: lunr

# Static BCP47 locale for MM's internal UI strings (date formats, accessibility labels).
# Runtime locale detection uses page.lang front matter exclusively.
locale: en-US

# Breadcrumbs must be disabled: MM breadcrumbs are not locale-aware (R-005).
breadcrumbs: false

# Default language for the site. Used as fallback in site_lang derivation:
# site_lang = page.lang | default: site.default_lang | default: 'en'
default_lang: "en"

# Language-first source roots. Pages and posts are authored under:
# - site/en
# - site/es
defaults:
  - scope:
      path: "site/en"
    values:
      lang: en
  - scope:
      path: "site/es"
    values:
      lang: es

# Build settings
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

# Suppress SASS deprecation warnings from MM gem dependencies (Dart Sass 3.0 compat warnings).
# These originate in MM's vendored SCSS (breakpoint, susy, magnific-popup) and are not actionable.
sass:
  quiet_deps: true

# Exclude from Jekyll processing entirely (not copied to _site).
# specs/ is excluded to prevent Jekyll from processing spec markdown files
# that contain MM-specific Liquid tags (include_cached) in code blocks.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - specs/
