<!DOCTYPE html>
<html lang="{{ page.lang | default: site.active_lang | default: site.default_lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
      {%- if page.title -%}
        {{ page.title | escape }} | {{ site.title | escape }}
      {%- else -%}
        {{ site.title | escape }}
      {%- endif -%}
    </title>
    <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 | escape }}">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    {%- feed_meta -%}
    {%- include hreflang-links.html -%}
  </head>
  <body>
    {%- include header.html -%}

    <div class="wrapper">
      {%- include language-switcher.html -%}
      {%- include translation-feedback.html -%}
    </div>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}
    <script src="{{ '/assets/js/language-session.js' | relative_url }}" defer></script>
  </body>
</html>
