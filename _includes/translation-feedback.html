{%- assign active_lang = page.lang | default: site.active_lang | default: site.default_lang | default: 'en' -%}
{%- assign messages = site.data.messages.translation_unavailable | default: empty -%}

<div
  id="translation-feedback"
  class="translation-feedback"
  role="status"
  aria-live="polite"
  hidden
  data-message-en="{{ messages.en }}"
  data-message-es="{{ messages.es }}"
>
  {{ messages[active_lang] | default: messages.en }}
</div>
