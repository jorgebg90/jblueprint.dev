<div class="page__content" style="text-align:center; padding: 3rem 1rem;">
  <h1 style="font-size: 4em; margin-bottom: 0.5rem;">404</h1>
  <p><strong>Page not found</strong></p>
  <p>The requested page could not be found.</p>
  <p><a href="{{ '/' | relative_url }}">Go to home</a></p>
</div>

<script>
  (function () {
    var url = new URL(window.location.href);
    var baseUrl = "{{ site.baseurl | default: '' }}";
    var path = url.pathname;

    if (baseUrl && path.indexOf(baseUrl) === 0) {
      path = path.slice(baseUrl.length) || "/";
    }

    if (!path.endsWith("/")) {
      path += "/";
    }

    // Prevent redirect loops: if this is already a fallback attempt, stop.
    if (url.searchParams.get("fallback_attempt") === "1") {
      return;
    }

    var redirectTarget = null;
    var isSpanish = path.startsWith("/es/") || path === "/es/";

    if (isSpanish) {
      // We're at a missing ES path — try the EN equivalent.
      var enPath = path.replace(/^\/es\//, "/").replace(/^\/es$/, "/");
      if (!enPath.startsWith("/")) enPath = "/" + enPath;
      redirectTarget = enPath + "?translation=unavailable&requested=es&fallback_attempt=1";
    } else {
      // We're at a missing EN path — try the ES equivalent.
      var esPath = path === "/" ? "/es/" : "/es" + path;
      redirectTarget = esPath + "?translation=unavailable&requested=en&fallback_attempt=1";
    }

    if (redirectTarget) {
      window.location.replace(redirectTarget);
    }
  })();
</script>
