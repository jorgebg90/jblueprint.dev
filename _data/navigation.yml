# MM masthead navigation — primary links displayed in the top bar.
# Global-navigation literals use labels.<lang> keys and are resolved in _includes/masthead.html.
# URLs use default-locale paths (no /es/ prefix).
# The language switcher is injected separately via _layouts/default.html.
main:
  - url: /
    labels:
      en: "Home"
      es: "Inicio"
  - url: /about/
    labels:
      en: "About"
      es: "Acerca de"

